<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrinFud — Order</title>
<meta name="theme-color" content="#1F5C3A">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1F5C3A;--forest:#143D27;--gold:#F2B33D;--deepgold:#B8760F;--cream:#FBF7EE;--ink:#17241C;--muted:#55655B;--line:#E4DDCC;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','DM Sans',sans-serif;letter-spacing:-0.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:var(--green);color:var(--cream);padding:18px 0 26px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px}
.brand .name{font-family:'Bricolage Grotesque';font-weight:800;font-size:28px;letter-spacing:-0.03em;line-height:1}
.brand .name span{color:var(--gold)}
.brand .tagline{font-size:14px;color:#CFE0D4;margin-top:3px}
.hero{margin-top:22px}
.hero h1{font-size:34px;line-height:1.02}
.hero p{margin:8px 0 0;color:#DCE8DF}
.closed{background:#FDEBD0;border:1px solid #E9C48A;color:#6B4A08;border-radius:14px;padding:14px 16px;margin-top:18px;font-weight:700}
.cat{margin:28px 0 12px;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.item{display:grid;grid-template-columns:1fr 112px;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.item h3{font-size:20px;color:var(--green)}
.item p{margin:6px 0 10px;color:var(--muted);font-size:15px}
.item .price{font-weight:700}
.item .price small{font-weight:400;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 9px;background:#EEF6F0;color:var(--green)}
.tag.raw{background:#FFF4DE;color:#6B4A08}
.item img,.item .ph{width:112px;height:112px;border-radius:14px;object-fit:cover;background:#EFE6D2;display:block}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;min-height:44px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--green);color:var(--cream)}
.btn-primary:hover{background:var(--forest)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.add{margin-top:auto}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(251,247,238,0),var(--cream) 30%)}
.bar .btn{width:100%;max-width:688px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:16px 20px;border-radius:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(23,36,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{position:relative;background:var(--cream);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:26px;color:var(--green)}
.sheet .x{float:right;background:none;border:0;font-size:28px;line-height:1;cursor:pointer;width:44px;height:44px;margin:-8px -8px 0 0}
.group{margin-top:18px}
.group .gt{font-weight:700;margin-bottom:8px}
.group .req{font-size:12px;font-weight:700;color:var(--deepgold);margin-left:6px;text-transform:uppercase;letter-spacing:.08em}
.choice{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:48px}
.choice input{width:20px;height:20px;accent-color:var(--green)}
.choice .p{margin-left:auto;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.qty span{min-width:32px;text-align:center;font-weight:700;font-size:18px}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input.t,select.t,textarea.t{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.line{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line .opts{font-size:14px;color:var(--muted)}
.line .rm{background:none;border:0;color:#9A3B2A;font-weight:700;cursor:pointer;padding:6px 0;min-height:32px}
.totals{margin-top:12px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .grand{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;color:var(--green)}
.err{background:#FBE3DE;color:#7A2717;border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;display:none}
.note{color:var(--muted);font-size:14px;margin-top:10px}
.done{text-align:center;padding:30px 4px}
.done .code{display:inline-block;background:var(--gold);color:var(--ink);font-family:'Bricolage Grotesque';font-weight:800;font-size:28px;padding:10px 20px;border-radius:14px;margin:14px 0}
footer{color:var(--muted);text-align:center;font-size:14px;padding:30px 16px 120px}
footer a{color:var(--green);font-weight:700}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;gap:10px;background:#25D366;color:var(--ink);font-weight:700;text-decoration:none;border-radius:999px;padding:12px 18px 12px 14px;min-height:52px;box-shadow:0 6px 20px rgba(23,36,28,.28);transition:bottom .2s,transform .15s}
.wa:hover{transform:translateY(-2px)}
.wa:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
.wa svg{width:28px;height:28px;flex:none}
body.has-bar .wa{bottom:calc(92px + env(safe-area-inset-bottom))}
@media(max-width:420px){.wa{padding:12px}.wa span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.wa{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* mobile */
html,body{overflow-x:hidden}
@supports(overflow:clip){html,body{overflow-x:clip}}
img{max-width:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sheet{max-height:92dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.line .rm{min-height:44px;padding:10px 0}
.line>b{white-space:nowrap}
#pinBox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
#pinBox .note{margin:0!important}
#pinBox .btn{min-height:44px!important}
body.sheet-open{overflow:hidden}
@media(max-width:480px){
 header{padding:14px 0 22px}
 .hero h1{font-size:29px}
 .item{grid-template-columns:1fr 88px;gap:12px;padding:12px}
 .item img,.item .ph{width:88px;height:88px}
 .item h3{font-size:18px}
 .item .add{min-width:96px}
 .sheet{padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0}
 .sheet h2{font-size:23px;padding-right:44px}
 .sheet .x{position:sticky;top:-6px;z-index:2}
 .totals .grand{font-size:20px}
 .done .code{font-size:24px}
}
@media(max-width:360px){
 .row2{grid-template-columns:1fr;gap:0}
 .item{grid-template-columns:1fr 72px}
 .item img,.item .ph{width:72px;height:72px}
 .bar .btn{font-size:16px;padding:14px 16px}
}
</style>
<link rel="stylesheet" href="/menu-cards.css">
<link rel="stylesheet" href="/chat-widget.css">
<link rel="stylesheet" href="/chat-launcher.css">
<link rel="stylesheet" href="/mobile-storefront.css">
<link rel="stylesheet" href="/item-sheet.css">
<link rel="stylesheet" href="/order-handoff.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><img class="brand-logo" src="/logo-horizontal-dark.svg" alt="GrinFud" width="855" height="240"></div>
    <div class="hero"><h1><span class="sr m-only">GrinFud — </span>Order fresh, delivered.</h1><p>Choose, customise and we'll bring it to your door.</p></div>
  </div>
</header>
<main class="wrap">
  <div id="closed" class="closed" hidden></div>
  <div id="menu" aria-live="polite"><p class="note" style="margin-top:28px">Loading the menu…</p></div>
</main>
<footer>Prefer to chat? <a id="waLink" href="#chat">Chat with us</a></footer>

<a class="wa" id="waFab" href="#chat" aria-label="Chat options: WhatsApp or chat here"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.400L3 29l6.800-1.700C11.600 28.400 13.800 29 16 29c7.200 0 13-5.800 13-13S23.200 3 16 3zm0 23.600c-2 0-3.900-.5-5.600-1.500l-.4-.2-4 1 1.100-3.900-.3-.4C5.800 19.900 5.200 18 5.200 16 5.200 10 10 5.200 16 5.200S26.800 10 26.800 16 22 26.600 16 26.600zm5.900-7.900c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.2-.2.300-.8 1-1 1.200-.2.200-.4.200-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.300-.2-.3 0-.5.100-.7.100-.1.300-.4.500-.600.200-.2.200-.3.300-.500.100-.2.100-.4 0-.600-.1-.2-.7-1.800-1-2.400-.3-.6-.5-.5-.7-.5h-.600c-.2 0-.6.100-.9.400-.3.300-1.200 1.100-1.200 2.800 0 1.600 1.200 3.200 1.400 3.500.200.200 2.400 3.600 5.700 5 .8.300 1.400.5 1.900.700.800.300 1.500.200 2.100.100.600-.1 1.900-.8 2.200-1.500.300-.8.300-1.400.200-1.500-.1-.2-.3-.2-.6-.4z"/></svg><span>WhatsApp</span></a>

<div class="bar" id="bar" hidden><button class="btn btn-primary" id="barBtn" type="button"><span>Continue in chat</span></button></div>

<div class="sheet-bg is-sheet" id="itemSheet" role="dialog" aria-modal="true" aria-labelledby="itemTitle"><div class="sheet" id="itemBody"></div></div>
<div class="sheet-bg" id="orderSheet" role="dialog" aria-modal="true" aria-labelledby="ohTitle"><div class="sheet" id="orderBody"></div></div>

<script src="/order-handoff.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let M = null;
const money = n => `${M?.currency || 'KSh'} ${Number(n || 0).toLocaleString('en-KE')}`;

async function load() {
  const r = await fetch('/api/menu'); M = await r.json();
  if (!M.accepting_orders) { $('#closed').hidden = false; $('#closed').textContent = M.closed_message; }
  renderMenu(); GFOrder.init(M);
}
function renderMenu() {
  if (!M.items.length) { $('#menu').innerHTML = '<p class="note" style="margin-top:28px">The menu is being updated. Please check back soon.</p>'; return; }
  const cats = [...new Set(M.items.map(i => i.category || 'Menu'))];
  $('#menu').innerHTML = cats.map(c => `<h2 class="cat">${esc(c)}</h2><div class="mc-grid">` + M.items.filter(i => (i.category || 'Menu') === c).map(card).join('') + '</div>').join('');
}
function priceHtml(i) { const o = Number(i.original_price), p = Number(i.price) || 0, on = o > p;
  const badge = !on ? '' : i.discount_type === 'percent' ? `${Math.round(Number(i.discount_value) || 0)}% off` : `Save ${money(o - p)}`;
  return `${on ? `<span class="sr">Now </span>` : ''}${p === 0 && on ? 'Free' : money(p)}${i.unit ? ` <small>/ ${esc(i.unit)}</small>` : ''}${on ? ` <s class="mc-was"><span class="sr">was </span>${money(o)}</s> <span class="mc-save">${badge}</span>` : ''}`; }
function incHtml(i) { return i.description ? `<div class="mc-inc"><div class="mc-k">What's included</div><p>${esc(i.description)}</p></div>` : ''; }
function imgsOf(i) { return (Array.isArray(i.images) ? i.images : (i.image ? [i.image] : [])).filter(u => typeof u === 'string' && u).slice(0, 6); }
function gallery(it, gi) { const im = imgsOf(it), n = im.length; if (!n) return '';
  return `<div class="is-hero is-gal"><img src="${esc(im[gi])}" alt="${esc(it.name)}${n > 1 ? `, photo ${gi + 1} of ${n}` : ''}" onerror="this.style.visibility='hidden'">
    ${n > 1 ? `<button type="button" class="gal-nav prev" data-gstep="-1" aria-label="Previous photo">‹</button><button type="button" class="gal-nav next" data-gstep="1" aria-label="Next photo">›</button><span class="gal-count" aria-live="polite">${gi + 1} / ${n}</span>` : ''}</div>
    ${n > 1 ? `<div class="gal-thumbs">${im.map((u, k) => `<button type="button" data-gi="${k}" aria-label="Show photo ${k + 1} of ${n}" ${k === gi ? 'aria-current="true"' : ''}><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}`; }
function card(i) {
  const opts = (i.options || []).filter(g => g.choices && g.choices.length);
  const og = opts.map(g => { const sh = g.choices.slice(0, 6); return `<div class="mc-og"><div class="mc-k">${esc(g.name)} <em>${g.required ? 'Required · ' : ''}${g.type === 'multi' ? 'choose any' : 'choose one'}</em></div>
    <ul class="mc-chips" aria-label="${esc(g.name)} options, chosen after opening">${sh.map(ch => `<li>${esc(ch.label)}${ch.price ? `<b>+${money(ch.price)}</b>` : ''}</li>`).join('')}${g.choices.length > 6 ? `<li class="more">+${g.choices.length - 6} more</li>` : ''}</ul></div>`; }).join('');
  const im0 = imgsOf(i)[0], nIm = imgsOf(i).length;
  return `<article class="mc${im0 ? ' mc-has-img' : ' mc-noimg'}">
    <div class="mc-top">${im0 ? `<div class="mc-media"><div class="mc-ph" aria-hidden="true">${esc((i.name || '?').trim().charAt(0))}</div><img src="${esc(im0)}" alt="${esc(i.name)}" loading="lazy" onerror="this.closest('.mc').classList.add('mc-imgfail');this.remove()"><span class="mc-shade" aria-hidden="true"></span>
      <button type="button" class="mc-open" data-add="${i.id}" aria-label="View photos and details: ${esc(i.name)}"><span class="mc-open-pill" aria-hidden="true">${nIm > 1 ? `${nIm} photos` : 'View'}</span></button></div>` : ''}
      <div class="mc-head"><h3 class="mc-title">${esc(i.name)}</h3><div class="mc-price">${priceHtml(i)}</div></div></div>${tags(i)}
    <div class="mc-body">${incHtml(i)}${og ? `<div class="mc-opts">${og}</div>` : ''}
      <button class="btn btn-gold add mc-cta" data-add="${i.id}" ${M.accepting_orders ? '' : 'disabled'}>${M.accepting_orders ? (opts.length ? 'Customize &amp; order' : 'View &amp; order') : 'Ordering closed'}</button></div>
  </article>`;
}
// What a buyer for an office or an Airbnb needs to know at a glance: cooked or raw, how many it feeds, smallest order.
function tags(i) {
  const t = [];
  if (i.prep === 'cooked') t.push('<span class="tag">Cooked · ready to eat</span>');
  if (i.prep === 'raw') t.push('<span class="tag raw">Raw · you cook it</span>');
  if (i.prep === 'both') t.push('<span class="tag">Cooked or raw</span>');
  if (i.serves) t.push(`<span class="tag">Serves ${i.serves}</span>`);
  if (i.min_qty > 1) t.push(`<span class="tag raw">Min ${i.min_qty}${i.unit ? ' ' + esc(i.unit) : ''}</span>`);
  return t.length ? `<div class="tags">${t.join('')}</div>` : '';
}
function lineUnit(item, opts) {
  let u = item.price;
  for (const g of item.options) for (const c of g.choices) if ((opts[g.name] || []).includes(c.label)) u += c.price;
  return u;
}
function openItem(id) {
  const it = M.items.find(i => i.id === id); if (!it) return;
  const min = it.min_qty || 1; let qty = min, gi = 0; const opts = {}, nImg = imgsOf(it).length;
  const body = $('#itemBody');
  const draw = () => {
    body.innerHTML = `<div class="is-closebar"><button class="x" aria-label="Close" data-close>×</button></div>${gallery(it, gi)}
      <div class="is-info"><div class="is-head"><h2 id="itemTitle">${esc(it.name)}</h2>
      <div class="is-price">${priceHtml(it)}</div></div>
      ${incHtml(it)}
      ${tags(it)}
      ${it.options.map((g, gi) => `<fieldset class="group"><legend class="gt">${esc(g.name)}${g.required ? '<span class="req">Required</span>' : ''}${g.type === 'multi' ? '<span class="note is-any">Choose any</span>' : ''}</legend><div class="is-choices">
        ${g.choices.map((c, ci) => `<label class="choice"><input type="${g.type === 'multi' ? 'checkbox' : 'radio'}" name="g${gi}" data-g="${gi}" data-c="${ci}" ${(opts[g.name] || []).includes(c.label) ? 'checked' : ''}><span>${esc(c.label)}</span>${c.price ? `<span class="p">+${money(c.price)}</span>` : ''}</label>`).join('')}</div></fieldset>`).join('')}
      <label class="f" for="inote">Special request (optional)</label>
      <input class="t" id="inote" maxlength="200" placeholder="e.g. ripe bananas please"></div>
      <div class="is-foot"><div class="err" id="iErr" role="alert"></div><div class="is-foot-row">
        <div class="qty"><button aria-label="Less" data-q="-1">−</button><span>${qty}</span><button aria-label="More" data-q="1">+</button></div>
        <button class="btn btn-primary" id="addBtn"><span>Order now</span> <span class="is-amt">· ${money(lineUnit(it, opts) * qty)}</span></button>
      </div></div>`;
  };
  draw(); $('#itemSheet').classList.add('open'); document.body.classList.add('sheet-open');
  body.onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheets();
    const gs = e.target.closest('[data-gstep],[data-gi]');
    if (gs) { gi = gs.dataset.gi != null ? Number(gs.dataset.gi) : (gi + Number(gs.dataset.gstep) + nImg) % nImg; const hero = body.querySelector('.is-gal'), th = body.querySelector('.gal-thumbs'); if (hero) { const tmp = document.createElement('div'); tmp.innerHTML = gallery(it, gi); hero.replaceWith(tmp.firstElementChild); if (th) th.replaceWith(tmp.querySelector('.gal-thumbs')); } const f = body.querySelector(gs.dataset.gi != null ? `[data-gi="${gi}"]` : `[data-gstep="${gs.dataset.gstep}"]`); if (f) f.focus(); return; }
    const q = e.target.closest('[data-q]'); if (q) { const n = $('#inote').value; qty = Math.min(50, Math.max(min, qty + Number(q.dataset.q))); draw(); $('#inote').value = n; return; }
    if (e.target.closest('#addBtn')) {
      const miss = it.options.find(g => g.required && !(opts[g.name] || []).length);
      if (miss) { const er = $('#iErr'); er.style.display = 'block'; er.textContent = `Please choose: ${miss.name}`; return; }
      const line = { item_id: it.id, name: it.name, qty, options: { ...opts }, note: $('#inote').value.trim(), unit: lineUnit(it, opts) };
      closeSheets(); GFOrder.add(line, document.querySelector(`.mc-cta[data-add="${it.id}"]`));
    }
  };
  let tx = null;
  body.ontouchstart = e => { tx = nImg > 1 && e.target.closest('.is-gal') && e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; };
  body.ontouchend = e => { if (!tx) return; const t = e.changedTouches[0], dx = t.clientX - tx[0], dy = t.clientY - tx[1]; tx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) { const b = body.querySelector(`[data-gstep="${dx < 0 ? 1 : -1}"]`); if (b) b.click(); } };
  body.onchange = e => {
    const el = e.target; if (el.dataset.g == null) return;
    const g = it.options[el.dataset.g], c = g.choices[el.dataset.c]; const n = $('#inote').value;
    if (g.type === 'multi') { const s = new Set(opts[g.name] || []); el.checked ? s.add(c.label) : s.delete(c.label); opts[g.name] = [...s]; }
    else opts[g.name] = [c.label];
    draw(); $('#inote').value = n;
  };
}
function closeSheets() { $('#itemSheet').classList.remove('open'); if (!document.querySelector('.sheet-bg.open')) document.body.classList.remove('sheet-open'); }
document.addEventListener('click', e => { const a = e.target.closest('[data-add]'); if (a) openItem(Number(a.dataset.add)); if (e.target.id === 'itemSheet') closeSheets(); });
$('#barBtn').onclick = e => GFOrder.open(e.currentTarget);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.body.classList.contains('gfc-lock')) closeSheets(); });
load().catch(() => { $('#menu').innerHTML = '<p class="err" style="display:block;margin-top:28px">Could not load the menu. Please refresh.</p>'; });
</script>
<script src="/voice-recorder.js" defer></script>
<script src="/chat-widget.js" defer></script>
